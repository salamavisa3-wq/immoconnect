# SakeurImmo — app (Node Express) uniquement. Le reverse proxy + HTTPS est
# géré par le Caddy PARTAGÉ de l'hôte (skill vps-deploy v2, multi-app) — ne
# PAS relancer un service "caddy" ici, ne PAS publier de ports.
# Base de données : Turso (externe, gratuit) → pas de conteneur db.
# Le .env doit exister à côté de ce fichier (jamais commité).

services:
  app:
    build: .
    container_name: sakeurimmo-app
    restart: unless-stopped
    env_file: .env
    expose:
      - "3001"
    networks:
      - caddy_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3001/api/sante"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  caddy_net:
    external: true
