# SakeurImmo — app (Node Express) + caddy (reverse proxy + HTTPS auto).
# Base de données : Turso (externe, gratuit) → pas de conteneur Postgres.
# Le .env doit exister à côté de ce fichier (jamais commité).

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3001/api/sante"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
