name: Deploy to Oracle VPS

# Déploie SakeurImmo sur le VPS Oracle Cloud Free Tier à chaque push sur master.
# Nécessite les secrets GitHub : VPS_HOST, VPS_USER, VPS_PORT, VPS_SSH_KEY.
# Le .env vit sur le serveur (/opt/sakeurimmo/.env) et est exclu du rsync.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy app files to VPS
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          REMOTE_PORT: ${{ secrets.VPS_PORT }}
          SOURCE: "./"
          TARGET: /opt/apps/sakeurimmo
          EXCLUDE: "/.env, /.git, /node_modules, /.claude-flow, /sakeurimmo, /seo-automation, /backend/node_modules, /docker-compose.override.yml"
          SCRIPT_BEFORE: |
            mkdir -p /opt/apps/sakeurimmo
          SCRIPT_AFTER: |
            /opt/scripts/deploy-rollback.sh /opt/apps/sakeurimmo
