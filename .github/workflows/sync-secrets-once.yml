name: Sync app secrets Render → Cloudflare Workers (one-time)

# Ponte manuel unique pour le cutover Cloudflare Workers : lit les vraies valeurs
# des variables d'environnement du service Render (API Render, RENDER_API_KEY)
# et les pose comme secrets Workers (wrangler secret put, CLOUDFLARE_API_TOKEN).
# Les valeurs ne transitent QUE par ce job — masquées dès extraction
# (::add-mask::), jamais affichées dans les logs. À supprimer une fois le
# cutover confirmé (voir deploy/MIGRATION.md).
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm install

      - name: Fetch Render env vars and push as Cloudflare Workers secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RENDER_SERVICE_ID: srv-d9oi5i5bedkc73cusvm0
        run: |
          set -euo pipefail
          REQUIRED="JWT_SECRET TURSO_DATABASE_URL TURSO_AUTH_TOKEN CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET"
          OPTIONAL="PAYPAL_CLIENT_ID PAYPAL_CLIENT_SECRET BREVO_API_KEY ADMIN_EMAIL MAIL_EXPEDITEUR"

          curl -sf -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100" \
            -o /tmp/render-env.json

          MISSING=""
          for KEY in $REQUIRED $OPTIONAL; do
            VALUE=$(jq -r --arg k "$KEY" '.[] | select(.envVar.key == $k) | .envVar.value' /tmp/render-env.json)
            if [ -z "$VALUE" ] || [ "$VALUE" = "null" ]; then
              echo "$KEY absent côté Render — ignoré."
              case " $REQUIRED " in *" $KEY "*) MISSING="$MISSING $KEY";; esac
              continue
            fi
            echo "::add-mask::$VALUE"
            printf '%s' "$VALUE" | npx wrangler secret put "$KEY"
            echo "✅ $KEY posé sur Cloudflare Workers."
          done

          rm -f /tmp/render-env.json

          if [ -n "$MISSING" ]; then
            echo "❌ Secrets requis absents côté Render :$MISSING"
            exit 1
          fi
