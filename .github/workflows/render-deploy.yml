name: deploy-to-render
# Déclenche un déploiement Render à chaque push sur master.
# Nécessité : le service Render a été créé via l'API avec un repo public
# (pas de GitHub App) → pas de webhook → autoDeploy=yes ne tire jamais.
# Ce workflow appelle l'API Render directement.
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          code=$(curl -sS -o /tmp/render-deploy.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/srv-d9oi5i5bedkc73cusvm0/deploys")
          echo "HTTP $code"
          if [ "$code" != "201" ]; then
            cat /tmp/render-deploy.json
            exit 1
          fi
