  </div>
</footer>

<script src="js/api.js"></script>
<script>
async function chargerAnnonces(params = {}) {
  const grille = document.getElementById("grille-resultats");
  grille.innerHTML = "<p>Chargement des annonces...</p>";

  const query = new URLSearchParams(Object.fromEntries(Object.entries(params).filter(([, v]) => v))).toString();

  try {
    const { resultats, total } = await appelApi(`/biens?${query}`);
    if (resultats.length === 0) {
      grille.innerHTML = `<p style="color:var(--texte-clair);">Aucune annonce ne correspond à votre recherche pour le moment.</p>`;
      return;
    }
    grille.innerHTML = resultats.map(carteAnnonce).join("");
    // Schema ItemList (annonces réelles) — uniquement sur la vue par défaut
    if (!query) injecterSchemaItemList(resultats);
  } catch (err) {
    grille.innerHTML = `<p style="color:var(--rouge-alerte);">${err.message}</p>`;
  }
}

function injecterSchemaItemList(annonces) {
  // Le serveur injecte déjà l'ItemList (data-ssr-itemlist) sur la vue par défaut → ne pas dupliquer
  if (document.querySelector("script[data-ssr-itemlist]")) return;
  const element = document.createElement("script");
  element.type = "application/ld+json";
  element.textContent = JSON.stringify({
    "@context": "https://schema.org",
    "@type": "ItemList",
    "itemListElement": annonces.map((b, i) => ({
      "@type": "ListItem",
      "position": i + 1,
      "url": `https://sakeurimmo.com${urlAnnonce(b)}`,
      "name": b.titre,
    })),
  });
  document.head.appendChild(element);
}

function carteAnnonce(b) {
  const enAvant = b.mise_en_avant === 1 &&
    (!b.mise_en_avant_jusqu_au || new Date(b.mise_en_avant_jusqu_au) > new Date());
  const image = b.images && b.images[0]
    ? `<img src="${window.location.hostname === 'localhost' ? 'http://localhost:4000' : ''}${b.images[0]}" alt="${b.titre}">`
    : `<span>Pas de photo</span>`;

  return `
    <a class="annonce-carte${enAvant ? ' annonce-en-avant' : ''}" href="${urlAnnonce(b)}">
      <div class="annonce-image">
        <span class="badge-type">${LIBELLES_TYPE[b.type_bien] || b.type_bien}</span>
        ${enAvant ? '<span class="badge-coup-de-coeur">★ Coup de cœur</span>' : ''}
        ${image}
      </div>
      <div class="annonce-corps">
        <h4>${b.titre}</h4>
        <div class="annonce-lieu">${b.quartier ? b.quartier + ", " : ""}${b.ville}</div>
        <div class="annonce-prix">${formaterPrix(b.prix)}</div>
        <div class="annonce-carac">
          ${b.superficie ? `<span>${b.superficie} m²</span>` : ""}
          ${b.chambres ? `<span>${b.chambres} ch.</span>` : ""}
          ${b.salles_bain ? `<span>${b.salles_bain} SDB</span>` : ""}
        </div>
      </div>
    </a>`;
}

document.getElementById("form-filtres").addEventListener("submit", (e) => {
  e.preventDefault();
  chargerAnnonces(Object.fromEntries(new FormData(e.target)));
});

// Lire les filtres depuis l'URL (ex. ?ville=Dakar) pour rendre le SearchAction fonctionnel
const filtresURL = new URLSearchParams(window.location.search);
chargerAnnonces(Object.fromEntries(filtresURL.entries()));
</script>

<script src="/js/menu.js"></script>
